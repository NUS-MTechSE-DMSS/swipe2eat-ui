user nginx;
worker_processes auto;
pid /var/run/nginx/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    server {
      listen 80 default_server;
      listen [::]:80 default_server;
      server_name _;

      # Root directory for Flutter web build
      root /usr/share/nginx/html;
      index index.html;

      # Gzip compression for better performance
      gzip on;
      gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
      gzip_min_length 1000;
      gzip_vary on;
      gzip_disable "msie6";

      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

      # Cache busting for versioned assets (js, css)
      location ~* ^/assets/ {
        # Versioned assets get long cache
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
      }

      # Cache busting for flutter generated service worker & manifest
      location ~* \.(js|json|wasm)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
      }

      # Main entry point - no cache for index.html
      location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }

      # SPA routing: serve index.html for all non-file routes
      location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
      }

      # Deny access to hidden files and directories
      location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
      }

      # Logging
      access_log /var/log/nginx/access.log combined buffer=32k;
      error_log /var/log/nginx/error.log warn;
    }
}

