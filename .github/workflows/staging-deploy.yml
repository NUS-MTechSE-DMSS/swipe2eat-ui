name: Staging Deploy

on:
  workflow_run:
    workflows:
      - Main Validation
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  deploy-web:
    name: deploy-web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: gh run download "${{ github.event.workflow_run.id }}" -n web-release -D build-artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g netlify-cli
      - id: deploy
        run: |
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          deploy_json=$(netlify deploy \
            --dir=build-artifacts/web-release \
            --alias="staging-${HEAD_SHA::7}" \
            --json)
          deploy_url=$(printf '%s' "$deploy_json" | jq -r '.deploy_url')
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy-android:
    name: deploy-android
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh staging "$RUNNER_TEMP/dart-defines.json"
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.STAGING_DART_DEFINES_JSON_BASE64 }}
      - run: printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: printf '%s' "${ANDROID_PLAY_JSON_KEY_BASE64}" | base64 --decode > "$RUNNER_TEMP/play.json"
        env:
          ANDROID_PLAY_JSON_KEY_BASE64: ${{ secrets.ANDROID_PLAY_JSON_KEY_BASE64 }}
      - run: bundle exec fastlane android staging
        env:
          DART_DEFINES_FILE: ${{ runner.temp }}/dart-defines.json
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPPLY_JSON_KEY: ${{ runner.temp }}/play.json
          ANDROID_PLAY_TRACK: ${{ vars.ANDROID_PLAY_TRACK || 'internal' }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}

  deploy-ios:
    name: deploy-ios
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: macos-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: pod install
        working-directory: ios
      - run: bash .github/scripts/materialize_dart_defines.sh staging "$RUNNER_TEMP/dart-defines.json"
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.STAGING_DART_DEFINES_JSON_BASE64 }}
      - run: bundle exec fastlane ios staging
        env:
          DART_DEFINES_FILE: ${{ runner.temp }}/dart-defines.json
          IOS_SCHEME: staging
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_NUMBER: ${{ github.event.workflow_run.run_number }}

  attach-desktop-artifacts:
    name: attach-desktop-artifacts
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir -p desktop-assets
          gh run download "${{ github.event.workflow_run.id }}" -n linux-release -D desktop-assets/linux
          gh run download "${{ github.event.workflow_run.id }}" -n windows-release -D desktop-assets/windows
          gh run download "${{ github.event.workflow_run.id }}" -n macos-release -D desktop-assets/macos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-validation-assets
          path: desktop-assets
          retention-days: 14
