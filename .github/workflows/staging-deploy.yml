name: Staging Deploy

on:
  workflow_run:
    workflows:
      - Main Validation
    types:
      - completed

permissions:
  actions: read
  contents: read
  id-token: write   # 新增: AWS OIDC 必需

jobs:
  deploy-web:
    name: deploy-web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - run: |
          rm -rf web-dist
          gh run download "${{ github.event.workflow_run.id }}" -n web-release -D web-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ===== AWS deploy (staging path: /staging/{sha7}/) =====
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - id: deploy
        name: Deploy staging build to AWS S3 + CloudFront
        run: |
          set -euo pipefail

          ART_DIR="web-dist"
          if [[ ! -d "$ART_DIR" ]]; then
            echo "Expected artifact directory '$ART_DIR' not found." >&2
            exit 1
          fi

          echo "Artifact directory listing:" >&2
          find "$ART_DIR" -maxdepth 2 -type f | sort | sed 's/^/- /' >&2

          if [[ ! -f "$ART_DIR/index.html" ]]; then
            echo "Expected Flutter web entrypoint '$ART_DIR/index.html' not found." >&2
            exit 1
          fi

          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${HEAD_SHA::7}"
          DEPLOY_PREFIX="staging/${SHORT_SHA}"

          # Sync 整个 staging build 到独立 prefix; --delete 只影响这个 prefix 内
          aws s3 sync "$ART_DIR" "s3://${{ vars.S3_BUCKET }}/${DEPLOY_PREFIX}/" \
            --delete \
            --cache-control "public,max-age=300,must-revalidate"

          # index.html no-cache (确保 staging URL 总是拿最新)
          aws s3 cp "$ART_DIR/index.html" "s3://${{ vars.S3_BUCKET }}/${DEPLOY_PREFIX}/index.html" \
            --cache-control "public,max-age=0,must-revalidate"

          # 失效仅 staging 路径, 不影响 production
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/${DEPLOY_PREFIX}/*" \
            --query 'Invalidation.Id' --output text)

          # AWS staging URL — Lighthouse 和 ZAP 用的就是这个
          deploy_url="https://${{ vars.CF_DOMAIN_NAME }}/${DEPLOY_PREFIX}/"
          echo "deploy_url=$deploy_url" >> "$GITHUB_OUTPUT"

          {
            echo "### Web Staging Deploy (AWS)"
            echo
            echo "- Artifact: \`web-release\`"
            echo "- SHA: \`${SHORT_SHA}\`"
            echo "- Path: \`${DEPLOY_PREFIX}/\`"
            echo "- CloudFront invalidation: \`$INVALIDATION_ID\`"
            echo "- Preview URL: $deploy_url"
          } >> "$GITHUB_STEP_SUMMARY"

      # ===== Netlify staging deploy (FALLBACK - 后续 sprint 删除) =====
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - run: npm install -g netlify-cli
      - name: Netlify staging deploy (fallback)
        continue-on-error: true   # AWS 是主, Netlify 失败不阻塞
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.workflow_run.head_sha }}"
          netlify deploy \
            --dir="web-dist" \
            --alias="staging-${HEAD_SHA::7}" \
            --no-build || echo "Netlify staging fallback failed (non-blocking)"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Show staging URLs
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_URL}" ]]; then
            echo "::warning title=Staging URL unavailable::AWS staging deploy did not produce a URL."
            exit 0
          fi

          echo "AWS staging URL: ${DEPLOY_URL}"
          echo "::notice title=AWS staging URL::${DEPLOY_URL}"
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deploy_url }}

  deploy-android:
    name: deploy-android
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh staging "$RUNNER_TEMP/dart-defines.json"
        env:
          DART_DEFINES_JSON_BASE64: ${{ secrets.STAGING_DART_DEFINES_JSON_BASE64 }}
      - run: printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      - run: printf '%s' "${FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64}" | base64 --decode > "$RUNNER_TEMP/firebase-appdist.json"
        env:
          FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64: ${{ secrets.FIREBASE_APPDISTRO_SERVICE_ACCOUNT_JSON_BASE64 }}
      - run: npm install -g firebase-tools
      - name: Build staging APK
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if flutter build apk --release --flavor staging --dart-define-from-file="$RUNNER_TEMP/dart-defines.json" --build-number="${{ github.event.workflow_run.run_number }}"; then
              exit 0
            fi

            if [[ "$attempt" == "3" ]]; then
              echo "Staging APK build failed after ${attempt} attempts." >&2
              exit 1
            fi

            echo "Staging APK build failed on attempt ${attempt}; retrying after a short delay..." >&2
            sleep 20
          done
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Distribute staging APK to Firebase App Distribution
        run: |
          set -euo pipefail

          if [[ -z "${FIREBASE_ANDROID_APP_ID_STAGING:-}" ]]; then
            echo "Set FIREBASE_ANDROID_APP_ID_STAGING as a staging environment variable." >&2
            exit 1
          fi

          head_sha="${{ github.event.workflow_run.head_sha }}"

          args=(
            appdistribution:distribute
            build/app/outputs/flutter-apk/app-staging-release.apk
            --app
            "${FIREBASE_ANDROID_APP_ID_STAGING}"
            --release-notes
            "Staging build from ${GITHUB_REPOSITORY}@${head_sha}"
          )

          if [[ -z "${FIREBASE_APPDISTRO_TESTERS:-}" ]]; then
            echo "Set FIREBASE_APPDISTRO_TESTERS as comma-separated tester emails." >&2
            exit 1
          fi

          args+=(--testers "${FIREBASE_APPDISTRO_TESTERS}")

          firebase "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/firebase-appdist.log"

          console_uri=$(sed -n 's/.*firebase_console_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)
          testing_uri=$(sed -n 's/.*testing_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)
          binary_uri=$(sed -n 's/.*binary_download_uri:[[:space:]]*//p' "$RUNNER_TEMP/firebase-appdist.log" | tail -n 1)

          {
            echo "### Android Staging Distribution"
            echo
            echo "- Package: \`edu.nus.swipe2eat.staging\`"
            echo "- Artifact: \`app-staging-release.apk\`"
            if [[ -n "$console_uri" ]]; then
              echo "- Firebase console: $console_uri"
            fi
            if [[ -n "$testing_uri" ]]; then
              echo "- Tester install page: $testing_uri"
            fi
            if [[ -n "$binary_uri" ]]; then
              echo "- Direct download link: $binary_uri"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FIREBASE_ANDROID_APP_ID_STAGING: ${{ vars.FIREBASE_ANDROID_APP_ID_STAGING }}
          FIREBASE_APPDISTRO_TESTERS: ${{ vars.FIREBASE_APPDISTRO_TESTERS }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-appdist.json
      - uses: actions/upload-artifact@v6
        with:
          name: staging-android-apk
          path: build/app/outputs/flutter-apk/app-staging-release.apk
          if-no-files-found: error
          retention-days: 14

  lighthouse-web:
    name: lighthouse-web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs:
      - deploy-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false
      - run: npm install -g lighthouse@12.8.2
      - name: Run Lighthouse audit
        continue-on-error: true  # Flutter CanvasKit renders to <canvas>, Lighthouse NO_FCP is expected
        run: |
          set -euo pipefail

          mkdir -p lighthouse-report
          lighthouse "${DEPLOY_URL}" \
            --chrome-flags="--headless --no-sandbox" \
            --skip-audits=largest-contentful-paint,largest-contentful-paint-element,lcp-breakdown-insight,lcp-discovery-insight,lcp-lazy-loaded,prioritize-lcp-image,total-blocking-time,interactive,redirects,uses-rel-preconnect,third-party-summary,third-party-facades,long-tasks,offscreen-images,unminified-css,unminified-javascript,unused-css-rules,unused-javascript,modern-image-formats,uses-optimized-images,uses-text-compression,uses-responsive-images,efficient-animated-content,duplicated-javascript,legacy-javascript,uses-http2 \
            --output=html \
            --output=json \
            --output-path=lighthouse-report/report

          json_report="lighthouse-report/report.report.json"
          html_report="lighthouse-report/report.report.html"

          if [[ ! -f "$json_report" ]]; then
            echo "Expected Lighthouse JSON report '$json_report' not found." >&2
            find lighthouse-report -maxdepth 1 -type f | sort >&2
            exit 1
          fi

          node - "$json_report" <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const categories = report.categories;
          const score = (name) => {
            const value = categories?.[name]?.score;
            return typeof value === 'number' ? Math.round(value * 100) : 'n/a';
          };

          console.log('### Lighthouse Web Performance');
          console.log('');
          console.log(`- URL: ${report.finalDisplayedUrl || report.finalUrl}`);
          console.log(`- Performance (CanvasKit-adjusted): ${score('performance')}`);
          console.log(`- Accessibility: ${score('accessibility')}`);
          console.log(`- Best practices: ${score('best-practices')}`);
          console.log(`- SEO: ${score('seo')}`);
          console.log('- LCP/TBT-dependent audits: skipped because CanvasKit does not expose a DOM-backed LCP element.');
          NODE

          if [[ -f "$html_report" ]]; then
            echo "- HTML report: uploaded as \`staging-lighthouse-report\` artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          DEPLOY_URL: ${{ needs.deploy-web.outputs.deploy_url }}
      - uses: actions/upload-artifact@v6
        with:
          name: staging-lighthouse-report
          path: lighthouse-report
          if-no-files-found: error
          retention-days: 14

  dast-web:
    name: dast-web
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    needs:
      - deploy-web
    runs-on: ubuntu-latest
    steps:
      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true
        with:
          target: ${{ needs.deploy-web.outputs.deploy_url }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: staging-zap-baseline-report
          cmd_options: "-a"
      - name: Summarize DAST scan
        run: |
          {
            echo "### DAST Web Scan"
            echo
            echo "- Tool: OWASP ZAP baseline"
            echo "- Target: ${DEPLOY_URL}"
            echo "- Mode: report-only"
            echo "- Artifact: \`staging-zap-baseline-report\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPLOY_URL: ${{ needs.deploy-web.outputs.deploy_url }}
