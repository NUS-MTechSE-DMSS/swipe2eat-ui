name: PR CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .

  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Install lcov
        run: sudo apt-get update && sudo apt-get install -y lcov
      - name: Generate HTML coverage report
        run: genhtml coverage/lcov.info -o coverage/html
      - uses: actions/upload-artifact@v6
        with:
          name: pr-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 5
      - uses: actions/upload-artifact@v6
        with:
          name: pr-coverage-html
          path: coverage/html
          if-no-files-found: error
          retention-days: 5

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.160.0
    steps:
      - uses: actions/checkout@v5
      - name: Run semgrep
        id: semgrep
        run: |
          set +e
          semgrep scan --config auto --error --sarif --output semgrep-report.sarif
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload semgrep report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semgrep-report
          path: semgrep-report.sarif
          if-no-files-found: ignore
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 detect \
            --source=/repo \
            --redact \
            --no-banner \
            --report-format sarif \
            --report-path /repo/gitleaks-report.sarif
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
        id: gitleaks
      - name: Upload gitleaks report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Snyk Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check Snyk token
        id: snyk-token
        run: |
          if [[ -z "${SNYK_TOKEN}" ]]; then
            echo "SNYK_TOKEN is not set; skipping report-only Snyk scan."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Setup Snyk CLI
        if: steps.snyk-token.outputs.available == 'true'
        uses: snyk/actions/setup@master
        continue-on-error: true
      - name: Run Snyk scan
        if: steps.snyk-token.outputs.available == 'true'
        run: bash .github/scripts/run_snyk_scans.sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  build-web:
    name: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build web --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v6
        with:
          name: pr-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 5

  build-android:
    name: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build appbundle --debug --flavor dev --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v6
        with:
          name: pr-android-bundle
          path: build/app/outputs/bundle/devDebug/app-dev-debug.aab
          if-no-files-found: error
          retention-days: 5
