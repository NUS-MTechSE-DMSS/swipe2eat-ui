name: Flutter Web CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Test And Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

  security:
    name: Snyk Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Validate Snyk token
        run: test -n "${SNYK_TOKEN}" || { echo "SNYK_TOKEN is not set"; exit 1; }
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@master

      - name: Install Dart SBOM generator
        run: dart pub global activate sbom

      - name: Create SBOM config
        run: |
          cat > sbom.yaml <<'EOF'
          type: spdx
          spdx:
            SPDXFormat: 'json'
          EOF

      - name: Generate pub dependency SBOM
        run: dart pub global run sbom

      - name: Normalize SBOM filename
        run: |
          if [ -f sbom-pub.json ]; then
            exit 0
          fi
          if [ -f sbom.spdx ]; then
            mv sbom.spdx sbom-pub.json
            exit 0
          fi
          if [ -f sbom.json ]; then
            mv sbom.json sbom-pub.json
            exit 0
          fi
          echo "Expected SBOM output was not found"
          find . -maxdepth 1 -type f -name 'sbom*' -print
          exit 1

      - name: Verify SBOM output
        run: test -f sbom-pub.json || { echo "sbom-pub.json was not created"; exit 1; }

      - name: Run Snyk scan
        run: snyk sbom test --experimental --file=sbom-pub.json
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy:
    name: Deploy To Netlify
    needs:
      - ci
      - security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy_url: ${{ steps.netlify.outputs.deploy-url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Netlify secrets
        run: |
          test -n "${NETLIFY_AUTH_TOKEN}" || { echo "NETLIFY_AUTH_TOKEN is not set"; exit 1; }
          test -n "${NETLIFY_SITE_ID}" || { echo "NETLIFY_SITE_ID is not set"; exit 1; }
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Download web artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web

