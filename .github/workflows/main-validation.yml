name: Main Validation

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh staging "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build web --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: build/web
          retention-days: 14

  web-integration:
    name: web-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter test integration_test/app_smoke_test.dart -d chrome --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"

  android-integration:
    name: android-integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - uses: ReactiveCircus/android-emulator-runner@v2.35.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          script: flutter test integration_test/app_smoke_test.dart -d emulator-5554 --flavor dev --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"

  android-testlab-packages:
    name: android-testlab-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build apk --debug --flavor dev --target integration_test/app_smoke_test.dart --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - run: ./gradlew app:assembleDevDebugAndroidTest -Ptarget=integration_test/app_smoke_test.dart
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-apk
          path: android/app/build/outputs/apk/androidTest/dev/debug/app-dev-debug-androidTest.apk
          retention-days: 14

  ios-testlab-package:
    name: ios-testlab-package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: pod install
        working-directory: ios
      - run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme dev \
            -configuration Debug \
            -derivedDataPath build/ios_testlab \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing
      - run: |
          cd build/ios_testlab/Build/Products
          zip -r ios-testlab.zip Debug-iphoneos *.xctestrun
      - uses: actions/upload-artifact@v4
        with:
          name: ios-testlab
          path: build/ios_testlab/Build/Products/ios-testlab.zip
          retention-days: 14

  linux-build:
    name: linux-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build linux --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle
          retention-days: 14

  macos-build:
    name: macos-build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
      - run: flutter build macos --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release
          retention-days: 14

  windows-build:
    name: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true
      - run: flutter pub get
      - run: bash .github/scripts/materialize_dart_defines.sh dev "$RUNNER_TEMP/dart-defines.json"
        shell: bash
      - run: flutter build windows --release --dart-define-from-file="$RUNNER_TEMP/dart-defines.json"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release
          retention-days: 14
