name: Deploy to Railway

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allow manual trigger

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Railway

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Railway

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        if: env.RAILWAY_TOKEN != ''
        run: railway up --service web
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

      - name: Get deployment URL
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Your app is now live on Railway"
          echo "Check: https://railway.app for deployment details"

      - name: Notify failure
        if: failure()
        run: |
          echo "❌ Deployment failed. Check logs above for details."
          exit 1

  # Optional: Run tests before deployment
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.8'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test --no-pub

  # Optional: Build and test locally
  build-check:
    runs-on: ubuntu-latest
    name: Check Docker Build
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.railway
          push: false
          tags: swipe2eat-ui:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
